{{ partial "head.html" . }}
{{ partial "header.html" . }}
<main class="site-main prose post-page">
  <article>
    <header class="post-header">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
      <h1>{{ .Title }}</h1>
    </header>
    {{ .Content }}
  </article>
  <nav class="post-nav" aria-label="Post navigation">
    {{ with .PrevInSection }}<a href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}
    {{ with .NextInSection }}<a href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}
  </nav>
</main>
{{ partial "footer.html" . }}
